<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Biblioteca</title>
<style>
  :root { --bg:#f4f6fa; --card:#fff; --txt:#1f2937; --muted:#6b7280; --brand:#2563eb; --danger:#dc2626; --ok:#16a34a; --line:#e5e7eb; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; background:var(--bg); color:var(--txt); }
  header { background:var(--brand); color:#fff; padding:18px 24px; }
  header h1 { margin:0; font-size:1.4rem; }
  main { max-width: 900px; margin: 20px auto; padding: 0 16px; }
  nav { display:flex; gap:8px; margin-bottom:16px; }
  nav button { flex:1; padding:10px; border:1px solid var(--line); background:var(--card); border-radius:8px; cursor:pointer; font-size:1rem; }
  nav button.activa { background:var(--brand); color:#fff; border-color:var(--brand); }
  section { display:none; background:var(--card); border-radius:12px; padding:18px; box-shadow:0 1px 3px rgba(0,0,0,.08); }
  section.activa { display:block; }
  form { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:16px; }
  input, select { padding:9px 10px; border:1px solid var(--line); border-radius:8px; font-size:.95rem; flex:1 1 140px; min-width:0; }
  button.accion { padding:9px 16px; border:0; border-radius:8px; background:var(--brand); color:#fff; cursor:pointer; font-size:.95rem; }
  button.peligro { background:var(--danger); }
  button.chico { padding:5px 10px; font-size:.85rem; }
  .tabla-wrap { overflow-x:auto; }
  table { width:100%; border-collapse:collapse; }
  th, td { text-align:left; padding:10px 8px; border-bottom:1px solid var(--line); font-size:.93rem; }
  th { color:var(--muted); font-weight:600; }
  .etiqueta { padding:2px 10px; border-radius:99px; font-size:.8rem; color:#fff; }
  .disp { background:var(--ok); } .pres { background:var(--danger); }
  .vacio { color:var(--muted); text-align:center; padding:20px; }
  #mensaje { position:fixed; bottom:20px; left:50%; transform:translateX(-50%); padding:12px 20px; border-radius:8px; color:#fff; display:none; max-width:90%; }
  #mensaje.error { background:var(--danger); } #mensaje.exito { background:var(--ok); }
</style>
</head>
<body>
<header><h1>📚 Biblioteca</h1></header>
<main>
  <nav>
    <button data-tab="libros" class="activa">Libros</button>
    <button data-tab="usuarios">Usuarios</button>
    <button data-tab="prestamos">Préstamos</button>
  </nav>

  <section id="libros" class="activa">
    <form id="form-libro">
      <input name="titulo" placeholder="Título" required>
      <input name="autor" placeholder="Autor" required>
      <input name="anio" type="number" placeholder="Año" required>
      <button class="accion">Agregar</button>
    </form>
    <div class="tabla-wrap"><table><thead><tr><th>ID</th><th>Título</th><th>Autor</th><th>Año</th><th>Estado</th><th></th></tr></thead><tbody id="t-libros"></tbody></table></div>
  </section>

  <section id="usuarios">
    <form id="form-usuario">
      <input name="nombre" placeholder="Nombre" required>
      <input name="correo" type="email" placeholder="Correo" required>
      <button class="accion">Agregar</button>
    </form>
    <div class="tabla-wrap"><table><thead><tr><th>ID</th><th>Nombre</th><th>Correo</th></tr></thead><tbody id="t-usuarios"></tbody></table></div>
  </section>

  <section id="prestamos">
    <form id="form-prestamo">
      <select name="libroId" id="sel-libros" required></select>
      <select name="usuarioId" id="sel-usuarios" required></select>
      <button class="accion">Prestar</button>
    </form>
    <div class="tabla-wrap"><table><thead><tr><th>ID</th><th>Libro</th><th>Usuario</th><th>Fecha</th><th></th></tr></thead><tbody id="t-prestamos"></tbody></table></div>
  </section>
</main>
<div id="mensaje"></div>

<script>
const $ = id => document.getElementById(id);

async function api(url, opciones) {
  const r = await fetch(url, opciones);
  const datos = await r.json();
  if (!r.ok) throw new Error(datos.error || "Error desconocido");
  return datos;
}

function aviso(texto, tipo) {
  const m = $("mensaje");
  m.textContent = texto; m.className = tipo; m.style.display = "block";
  setTimeout(() => m.style.display = "none", 3000);
}

function fila(tbody, celdas) {
  const tr = document.createElement("tr");
  celdas.forEach(c => {
    const td = document.createElement("td");
    if (c instanceof Node) td.appendChild(c); else td.textContent = c;
    tr.appendChild(td);
  });
  tbody.appendChild(tr);
}

function vacio(tbody, cols) {
  const tr = document.createElement("tr");
  const td = document.createElement("td");
  td.colSpan = cols; td.className = "vacio"; td.textContent = "Sin registros";
  tr.appendChild(td); tbody.appendChild(tr);
}

function boton(texto, clase, onclick) {
  const b = document.createElement("button");
  b.textContent = texto; b.className = "accion chico " + clase; b.onclick = onclick;
  return b;
}

async function ejecutar(promesa, mensajeOk) {
  try { await promesa; if (mensajeOk) aviso(mensajeOk, "exito"); await cargar(); return true; }
  catch (e) { aviso(e.message, "error"); return false; }
}

async function cargar() {
  try {
    const [libros, usuarios, prestamos] = await Promise.all([
      api("/api/libros"), api("/api/usuarios"), api("/api/prestamos")]);

    const tl = $("t-libros"); tl.innerHTML = "";
    libros.forEach(l => {
      const tag = document.createElement("span");
      tag.className = "etiqueta " + (l.disponible ? "disp" : "pres");
      tag.textContent = l.disponible ? "Disponible" : "Prestado";
      fila(tl, [l.id, l.titulo, l.autor, l.anio, tag,
        boton("Eliminar", "peligro", () => {
          if (confirm("¿Eliminar \"" + l.titulo + "\"?"))
            ejecutar(api("/api/libros?id=" + l.id, { method: "DELETE" }), "Libro eliminado");
        })]);
    });
    if (!libros.length) vacio(tl, 6);

    const tu = $("t-usuarios"); tu.innerHTML = "";
    usuarios.forEach(u => fila(tu, [u.id, u.nombre, u.correo]));
    if (!usuarios.length) vacio(tu, 3);

    const tp = $("t-prestamos"); tp.innerHTML = "";
    prestamos.forEach(p => fila(tp, [p.id, p.libro, p.usuario, p.fecha,
      boton("Devolver", "", () => ejecutar(api("/api/prestamos?id=" + p.id, { method: "DELETE" }), "Libro devuelto"))]));
    if (!prestamos.length) vacio(tp, 5);

    $("sel-libros").innerHTML = "";
    libros.filter(l => l.disponible).forEach(l => $("sel-libros").add(new Option(l.titulo, l.id)));
    $("sel-usuarios").innerHTML = "";
    usuarios.forEach(u => $("sel-usuarios").add(new Option(u.nombre, u.id)));
  } catch (e) { aviso(e.message, "error"); }
}

function enviar(idForm, url, mensajeOk) {
  $(idForm).addEventListener("submit", async ev => {
    ev.preventDefault();
    const datos = new URLSearchParams(new FormData(ev.target));
    if (await ejecutar(api(url, { method: "POST", body: datos }), mensajeOk)) ev.target.reset();
  });
}
enviar("form-libro", "/api/libros", "Libro registrado");
enviar("form-usuario", "/api/usuarios", "Usuario registrado");
enviar("form-prestamo", "/api/prestamos", "Préstamo registrado");

document.querySelectorAll("nav button").forEach(b => b.addEventListener("click", () => {
  document.querySelectorAll("nav button, section").forEach(e => e.classList.remove("activa"));
  b.classList.add("activa"); $(b.dataset.tab).classList.add("activa");
}));

cargar();
</script>
</body>
</html>
